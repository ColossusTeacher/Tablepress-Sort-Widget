name: "HERON"
run-name: "Spruce"
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  pages: write
  contents: read
  id-token: write
jobs:
  SEABED:
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.pine.outputs.page_url }}
    steps:
      - name: "Lightning"
        uses: actions/checkout@v7
      - name: "Thorn"
        uses: actions/configure-pages@v5
      - name: "linen"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: "Wolfsbane"
        id: pine
        uses: actions/deploy-pages@v4
